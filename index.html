<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monica Bernasconi — Desktop</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── DESKTOP ─── -->
<div class="desktop">

    <!-- Background -->
    <div class="desktop-bg"></div>

    <!-- Sticky Note -->
    <div class="sticky">
        <strong>"Another thing you did. Another place you've been."</strong>
        <div class="attribution">— Bourdain</div>
    </div>

    <!-- ─── SIDEBAR ─── -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">MB</span>
        </div>

        <div class="sidebar-nav">
            <button class="folder active" data-folder="work" onclick="switchFolder('work')">
                <span class="folder-icon">📁</span>
                <span class="folder-name">Work</span>
            </button>
            <button class="folder" data-folder="map" onclick="switchFolder('map')">
                <span class="folder-icon">🗺️</span>
                <span class="folder-name">Map</span>
            </button>
            <button class="folder" data-folder="experience" onclick="switchFolder('experience')">
                <span class="folder-icon">📋</span>
                <span class="folder-name">Experience</span>
            </button>
            <button class="folder" data-folder="approach" onclick="switchFolder('approach')">
                <span class="folder-icon">🧠</span>
                <span class="folder-name">Approach</span>
            </button>
            <button class="folder" data-folder="skills" onclick="switchFolder('skills')">
                <span class="folder-icon">🔧</span>
                <span class="folder-name">Skills</span>
            </button>
            <button class="folder" data-folder="about" onclick="switchFolder('about')">
                <span class="folder-icon">👤</span>
                <span class="folder-name">About</span>
            </button>
            <button class="folder" data-folder="contact" onclick="switchFolder('contact')">
                <span class="folder-icon">✉️</span>
                <span class="folder-name">Contact</span>
            </button>
        </div>
    </div>

    <!-- ─── MAIN WINDOW ─── -->
    <div class="main-window">
        <div class="window-header">
            <div class="window-controls">
                <span class="window-dot close"></span>
                <span class="window-dot minimize"></span>
                <span class="window-dot expand"></span>
            </div>
            <span class="window-title" id="windowTitle">WORK.txt</span>
        </div>
        <div class="window-body" id="windowBody">
            <!-- Content loaded by JavaScript -->
        </div>
    </div>

</div>

<!-- ─── TASKBAR ─── -->
<div class="taskbar">
    <div class="taskbar-left">
        <button class="taskbar-icon" onclick="switchFolder('contact')">
            <span class="emoji">✉️</span> Contact
        </button>
        <button class="taskbar-icon" onclick="window.open('https://github.com/itsmomob', '_blank')">
            <span class="emoji">🐙</span> GitHub
        </button>
        <button class="taskbar-icon" onclick="window.open('https://www.linkedin.com/in/monica-bernasconi/', '_blank')">
            <span class="emoji">🔗</span> LinkedIn
        </button>
        <button class="taskbar-icon" onclick="window.open('https://monicabernasconi.my.canva.site/home', '_blank')">
            <span class="emoji">📁</span> Archive
        </button>
    </div>
    <div class="taskbar-right">
        <span class="monica-logo">M</span>
        <span class="divider">|</span>
        <span class="time" id="clock">--:--</span>
    </div>
</div>

<!-- ─── SCRIPTS ─── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
