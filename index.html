<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monica Bernasconi — Desktop</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── DESKTOP ─── -->
<div class="desktop" id="desktop">
    <div class="desktop-bg"></div>

   <!-- ─── SKILLS SIDEBAR (LEFT) ─── -->
<div class="skills-sidebar" id="skillsSidebar">
    <!-- Generated by JavaScript -->
</div>

<!-- ─── COLLAGE AREA ─── -->
<div class="collage-area" id="collageArea">
    <!-- Generated by JavaScript -->
</div>

<!-- ─── STICKY NOTE ─── -->
<div class="sticky">
    <strong>"Another thing you did. Another place you've been."</strong>
    <div class="attribution">— Bourdain</div>
</div>

    <!-- ─── WINDOW ─── -->
    <div class="window" id="mainWindow">
        <div class="window-header" id="windowHeader">
            <div class="window-controls">
                <span class="win-close" onclick="closeWindow()"></span>
                <span class="win-minimize" onclick="closeWindow()"></span>
                <span class="win-maximize" onclick="closeWindow()"></span>
            </div>
            <span class="window-title" id="windowTitle">Work</span>
        </div>
        <div class="window-body" id="windowBody">
            <!-- Content loaded by JavaScript -->
        </div>
    </div>
</div>

<!-- ─── TASKBAR ─── -->
<div class="taskbar">
    <!-- Start Button -->
    <button class="start-btn" onclick="switchFolder('work')">
        <span class="start-icon">⊞</span>
        <span class="start-label">Start</span>
    </button>

    <!-- Pinned Folders -->
    <div class="taskbar-pinned">
        <button class="taskbar-btn active" data-folder="work" onclick="switchFolder('work')">
            <span class="tb-icon">📁</span> Work
        </button>
        <button class="taskbar-btn" data-folder="map" onclick="switchFolder('map')">
            <span class="tb-icon">🗺️</span> Map
        </button>
        <button class="taskbar-btn" data-folder="experience" onclick="switchFolder('experience')">
            <span class="tb-icon">📋</span> Exp.
        </button>
        <button class="taskbar-btn" data-folder="approach" onclick="switchFolder('approach')">
            <span class="tb-icon">🧠</span> App.
        </button>
        <button class="taskbar-btn" data-folder="skills" onclick="switchFolder('skills')">
            <span class="tb-icon">🔧</span> Skills
        </button>
        <button class="taskbar-btn" data-folder="about" onclick="switchFolder('about')">
            <span class="tb-icon">👤</span> About
        </button>
        <button class="taskbar-btn" data-folder="contact" onclick="switchFolder('contact')">
            <span class="tb-icon">✉️</span> Contact
        </button>
    </div>

    <!-- System Tray -->
    <div class="system-tray">
        <button class="tray-icon" onclick="window.open('https://github.com/itsmomob', '_blank')" title="GitHub">🐙</button>
        <button class="tray-icon" onclick="window.open('https://www.linkedin.com/in/monica-bernasconi/', '_blank')" title="LinkedIn">🔗</button>
        <button class="tray-icon" onclick="window.open('https://monicabernasconi.my.canva.site/home', '_blank')" title="Archive">📁</button>
        <span class="tray-divider">|</span>
        <span class="tray-clock" id="clock">12:34</span>
    </div>
</div>

<!-- ─── SCRIPTS ─── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
